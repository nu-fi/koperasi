# Removed the version line to stop the warning
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: "True"
      SECRET_KEY: ${SECRET_KEY}

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"  
    depends_on:
      - backend
    volumes:
      - ./frontend:/app           
      - /app/node_modules         
    environment:                  
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true        # Mencegah bentrok library Windows vs Linux

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
volumes:
  postgres_data: